name: Broker CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    name: Gate / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, lint, test, 'test:contracts', security, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run ${{ matrix.gate }} gate
        run: npm run ci:gate -- ${{ matrix.gate }}
      - name: Save gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ strategy.job-index }}-${{ github.sha }}
          path: reports/
          retention-days: 14

  docker-smoke:
    name: Gate / Docker browser smoke
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build tested Docker image
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --build-arg "VCS_URL=${{ github.server_url }}/${{ github.repository }}" \
            -t broker:${{ github.sha }} . 2>&1 | tee reports/docker-build.log
          test "$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' broker:${{ github.sha }})" = "${{ github.sha }}"
      - name: Smoke the built image and clean up container
        run: npm run ci:gate -- test:e2e
      - name: Export the tested image for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: docker save broker:${{ github.sha }} | gzip -1 > reports/broker-image.tar.gz
      - name: Save image and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-${{ github.sha }}
          path: reports/
          retention-days: 14
      - name: Upload the tested image for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: reports/broker-image.tar.gz
          retention-days: 1

  publish-image:
    name: Release / immutable Docker artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    concurrency:
      group: broker-release-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      IMAGE_NAME: ${{ vars.CONTAINER_IMAGE || github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Require the supported immutable registry policy
        shell: bash
        run: |
          set -euo pipefail
          test "$REGISTRY" = "ghcr.io" || {
            echo "Only GHCR is supported: its package must have immutable commit-SHA tags enabled by repository administration." >&2
            exit 1
          }
          test "${{ vars.CONTAINER_REGISTRY_IMMUTABLE }}" = "true" || {
            echo "Set the repository variable CONTAINER_REGISTRY_IMMUTABLE=true only after GHCR tag immutability is configured." >&2
            exit 1
          }
      - name: Normalize image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="${IMAGE_NAME,,}"
          {
            echo "repository=${REGISTRY}/${image_name}"
            echo "published=${REGISTRY}/${image_name}:${COMMIT_SHA}"
            echo "staging=${REGISTRY}/${image_name}:staging-${COMMIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "local=broker:${COMMIT_SHA}"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: reports
      - name: Load the tested image without rebuilding
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
        run: |
          set -euo pipefail
          gunzip -c reports/broker-image.tar.gz | docker load
          docker tag "broker:${COMMIT_SHA}" "$LOCAL_IMAGE"
          test "$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' "$LOCAL_IMAGE")" = "$COMMIT_SHA"
      - name: Smoke the release image before publication
        env:
          BROKER_IMAGE: ${{ steps.image.outputs.local }}
        run: npm run ci:gate -- test:e2e
      - name: Refuse to overwrite an immutable commit tag
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.published }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$PUBLISHED_IMAGE" > reports/existing-manifest.json 2>/dev/null; then
            echo "Immutable image tag already exists; refusing to publish or replace it: $PUBLISHED_IMAGE" >&2
            exit 1
          fi
      - name: Push the tested image to a staging reference and record its digest
        id: publish
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
          STAGING_IMAGE: ${{ steps.image.outputs.staging }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$STAGING_IMAGE"
          docker push "$STAGING_IMAGE" 2>&1 | tee reports/docker-staging-push.log
          digest="$(docker buildx imagetools inspect "$STAGING_IMAGE" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          remote_digest="$(docker buildx imagetools inspect "$STAGING_IMAGE" --format '{{.Manifest.Digest}}')"
          test "$remote_digest" = "$digest"
      - name: Generate SBOM for the staged digest
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.repository }}@sha256:${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: reports/sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM to the staged digest
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: sha256:${{ steps.publish.outputs.digest }}
          sbom-path: reports/sbom.spdx.json
          push-to-registry: true
      - name: Attest build provenance to the staged digest
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: sha256:${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance and SBOM attestations for the staged digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          DIGEST: sha256:${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_REPOSITORY}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" --predicate-type https://slsa.dev/provenance/v1 \
            --format json > reports/provenance-verification.json
          gh attestation verify "oci://${IMAGE_REPOSITORY}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3 \
            --format json > reports/sbom-verification.json
      - name: Pull the attested staged digest and smoke it again
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          DIGEST: sha256:${{ steps.publish.outputs.digest }}
          BROKER_IMAGE: ${{ steps.image.outputs.repository }}@sha256:${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REPOSITORY}@${DIGEST}"
          npm run ci:gate -- test:e2e
      - name: Publish the immutable commit-SHA reference after verification
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          PUBLISHED_IMAGE: ${{ steps.image.outputs.published }}
          DIGEST: sha256:${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$PUBLISHED_IMAGE" "${IMAGE_REPOSITORY}@${DIGEST}"
          final_digest="$(docker buildx imagetools inspect "$PUBLISHED_IMAGE" --format '{{.Manifest.Digest}}')"
          test "$final_digest" = "$DIGEST"
          printf '%s@%s\n' "$PUBLISHED_IMAGE" "$DIGEST" > reports/image-reference.txt
          jq -n --arg sha "$COMMIT_SHA" --arg image "$PUBLISHED_IMAGE" --arg digest "$DIGEST" \
            '{commitSha:$sha,image:$image,digest:$digest}' > reports/release-metadata.json
      - name: Save release metadata, smoke results and attestations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-${{ github.sha }}
          path: reports/
          retention-days: 30

  required:
    name: Broker CI required
    if: always()
    needs: [gates, docker-smoke, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every gate to succeed
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/required-gates.mjs
