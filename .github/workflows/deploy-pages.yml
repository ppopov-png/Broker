name: Deploy Broker 2.0

on:
  push:
    branches:
      - broker-2.0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build --workspace=@trigonum/site

      - name: Build onboarding
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/open/
        run: npm run build --workspace=@trigonum/onboarding

      - name: Build cabinet
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/app/
        run: npm run build --workspace=@trigonum/cabinet

      - name: Assemble one deployment
        shell: bash
        run: |
          set -e
          rm -rf pages-dist
          mkdir -p pages-dist/open pages-dist/app
          cp -R apps/site/dist/. pages-dist/
          cp -R apps/onboarding/dist/. pages-dist/open/
          cp -R apps/cabinet/dist/. pages-dist/app/
          touch pages-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
