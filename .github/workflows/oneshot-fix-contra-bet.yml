name: One-shot contra bet UI fix

on:
  push:
    paths:
      - '.github/workflows/oneshot-fix-contra-bet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Events UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/cabinet/src/modules/events/pages/EventsPage.tsx')
          s = p.read_text()

          old = """  const scenarioLow = desiredAmount * event.targetLow / 100\n  const scenarioHigh = desiredAmount * event.targetHigh / 100\n"""
          new = """  const scenarioLow = desiredAmount * event.targetLow / 100\n  const scenarioHigh = desiredAmount * event.targetHigh / 100\n  const contraOdds = Math.max(1.2, Math.min(5, 1 + (event.committed / Math.max(1, event.contraCapital)) * 0.45))\n  const contraPayout = desiredAmount * contraOdds\n  const contraProfit = desiredAmount * (contraOdds - 1)\n"""
          if old not in s:
              raise SystemExit('calculation block not found')
          s = s.replace(old, new, 1)

          old = """<div className=\"grid grid-cols-2 gap-2\"><div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3\"><CompactStat label={`При +${event.targetLow}%`} value={`+${formatCurrency(scenarioLow)}`} tone=\"success\" /></div><div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3\"><CompactStat label={`При +${event.targetHigh}%`} value={`+${formatCurrency(scenarioHigh)}`} tone=\"success\" /></div></div><button type=\"button\" disabled={side === 'tais' ? !canInvestTais : !canInvestContra} onClick={reserve} className={`w-full rounded-xl px-4 py-3 text-sm font-black text-white disabled:opacity-40 ${side === 'tais' ? 'bg-emerald-600' : 'bg-violet-600'}`}>{side === 'tais' ? (remaining < desiredAmount ? 'Такой объём уже недоступен' : `Открыть ${event.taisPosition}`) : `Открыть ${event.counterPosition}`}</button>"""

          new = """{side === 'tais' ? <div className=\"grid grid-cols-2 gap-2\"><div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3\"><CompactStat label={`При +${event.targetLow}%`} value={`+${formatCurrency(scenarioLow)}`} tone=\"success\" /></div><div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3\"><CompactStat label={`При +${event.targetHigh}%`} value={`+${formatCurrency(scenarioHigh)}`} tone=\"success\" /></div></div> : <div className=\"space-y-2\"><div className=\"rounded-xl border border-violet-200 bg-violet-50 p-3\"><p className=\"text-[10px] font-bold uppercase tracking-wide text-violet-700\">Ставка против гипотезы TAIS</p><p className=\"mt-1 text-sm font-black text-violet-950\">TAIS не достигнет +{event.targetLow}% в горизонте {event.horizon}</p><p className=\"mt-1 text-xs text-violet-700\">Если нижняя граница цели TAIS не выполнена к завершению Event, ставка выигрывает.</p></div><div className=\"grid grid-cols-3 gap-2\"><div className=\"rounded-xl border border-violet-100 bg-violet-50 p-3\"><CompactStat label=\"Коэффициент\" value={`×${contraOdds.toFixed(2)}`} tone=\"blue\" /></div><div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3\"><CompactStat label=\"Выплата\" value={formatCurrency(contraPayout)} tone=\"success\" /></div><div className=\"rounded-xl border border-emerald-100 bg-emerald-50 p-3\"><CompactStat label=\"Прибыль\" value={`+${formatCurrency(contraProfit)}`} tone=\"success\" /></div></div></div>}<button type=\"button\" disabled={side === 'tais' ? !canInvestTais : !canInvestContra} onClick={reserve} className={`w-full rounded-xl px-4 py-3 text-sm font-black text-white disabled:opacity-40 ${side === 'tais' ? 'bg-emerald-600' : 'bg-violet-600'}`}>{side === 'tais' ? (remaining < desiredAmount ? 'Такой объём уже недоступен' : `Открыть ${event.taisPosition}`) : 'Поставить на неуспех TAIS'}</button>"""

          if old not in s:
              raise SystemExit('preview block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-fix-contra-bet.yml
          git add apps/cabinet/src/modules/events/pages/EventsPage.tsx
          git commit -m "Fix contra side as TAIS failure bet [skip ci]"
          git push
