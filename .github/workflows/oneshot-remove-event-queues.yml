name: One-shot remove Event queues

on:
  push:
    paths:
      - '.github/workflows/oneshot-remove-event-queues.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Events
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/cabinet/src/modules/events/pages/EventsPage.tsx')
          s = p.read_text()

          # Remove queue fields from types and mocks.
          s = re.sub(r'^\s*queueRequests\?: number\n', '', s, flags=re.M)
          s = re.sub(r'^\s*queueCapital\?: number\n', '', s, flags=re.M)
          s = re.sub(r'^\s*queueUsed: boolean\n', '', s, flags=re.M)
          s = re.sub(r'^\s*peakQueue: number\n', '', s, flags=re.M)
          s = re.sub(r'^\s*queueCapital: number\n', '', s, flags=re.M)
          s = re.sub(r'^\s*queueRequests: .*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*queueCapital: .*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*queueUsed: .*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*peakQueue: .*\n', '', s, flags=re.M)

          # Remove historical queue milestones and wording.
          s = re.sub(r"^\s*\{ label: '(?:Пиковая очередь|Очередь сформирована)'.*\n", '', s, flags=re.M)
          s = s.replace(' полностью распределён без очереди.', ' полностью распределён.')
          s = s.replace("{ label: 'Самая большая очередь', value: '61 инвестор', meta: 'Event #039 · спрос $684K', icon: Users },", "{ label: 'Больше всего инвесторов', value: '154 инвестора', meta: 'EV-ONC-045 · объём $1.25M', icon: Users },")
          s = s.replace("{ id: '#044', season: 'Сезон IV', result: '+18.2%', badge: 'Через очередь', position: 'LONG BTC' }", "{ id: '#044', season: 'Сезон IV', result: '+18.2%', badge: 'Участие', position: 'LONG BTC' }")

          # Gallery: a full Event is simply full.
          s = re.sub(r"\{full \? `Очередь \$\{event\.queueRequests \?\? 0\}` : affordable \? 'Доступен' : 'Недостаточно средств'\}", "{full ? 'Заполнен' : affordable ? 'Доступен' : 'Недостаточно средств'}", s)

          # EventDetail no longer accepts a release callback.
          s = s.replace(
              "function EventDetail({ event, onBack, onReserveTais, onReserveContra, onRelease }: { event: LiveEvent; onBack: () => void; onReserveTais: (amount: number) => void; onReserveContra: (amount: number) => void; onRelease: (amount: number) => void })",
              "function EventDetail({ event, onBack, onReserveTais, onReserveContra }: { event: LiveEvent; onBack: () => void; onReserveTais: (amount: number) => void; onReserveContra: (amount: number) => void })"
          )

          # Remove queue state and reset lines.
          for name in ['queueAmount', 'queuedAmount', 'queuePosition', 'queueAheadCapital']:
              s = re.sub(rf'^\s*const \[{name}, set[A-Za-z]+\] = useState[^\n]*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*setQueueAmount\([^\n]*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*setQueuedAmount\([^\n]*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*setQueuePosition\([^\n]*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*setQueueAheadCapital\([^\n]*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*const queueAmountValid = .*\n', '', s, flags=re.M)

          # Remove release and queue functions.
          s = re.sub(r'\n\s*const release = \(\) => \{[\s\S]*?\n\s*\}\n', '\n', s, count=1)
          s = re.sub(r'\n\s*const joinQueue = \(\) => \{[\s\S]*?\n\s*\}\n', '\n', s, count=1)
          s = re.sub(r'\n\s*const simulateQueueMove = \(\) => \{[\s\S]*?\n\s*\}\n', '\n', s, count=1)

          # Header KPI: always show investor count instead of queue stats.
          s = re.sub(
              r'<div className="p-3"><CompactStat label=\{full \? \'Очередь\' : \'Инвесторов\'\} value=\{full \? `\$\{event\.queueRequests \?\? 0\} чел\. · \$\{formatCurrency\(event\.queueCapital \?\? 0\)\}` : `\$\{event\.participants\}`\} tone=\{full \? \'blue\' : \'default\'\} /></div>',
              '<div className="p-3"><CompactStat label="Инвесторов" value={`${event.participants}`} /></div>',
              s
          )

          # Remove the compact queue info block under capital statistics.
          s = re.sub(r'\n\s*\{full && <div className="mt-3 grid gap-2 sm:grid-cols-3">[\s\S]*?</div>\}\n', '\n', s, count=1)

          # Replace the full-event queue branch in the action panel with a closed state.
          marker = '{full && side === \'tais\' ? <div className="space-y-4">'
          start = s.find(marker)
          if start != -1:
              else_marker = ': <div className="space-y-4"><div><p className="text-[10px] font-bold uppercase tracking-wide text-[var(--trigonum-muted)]">Выбранная позиция</p>'
              mid = s.find(else_marker, start)
              if mid == -1:
                  raise SystemExit('Could not locate Event action else branch')
              replacement = '''{full && side === 'tais' ? <div className="space-y-3"><div className="rounded-xl border border-blue-200 bg-blue-50 p-4"><p className="text-[10px] font-bold uppercase tracking-wide text-blue-700">Основной Event заполнен</p><p className="mt-2 text-lg font-black text-blue-950">Новые вложения больше не принимаются</p><p className="mt-2 text-sm leading-5 text-blue-800">Капитал участников уже зафиксирован в Event до его завершения.</p></div><button type="button" onClick={() => setSide('contra')} className="w-full rounded-xl border border-violet-200 bg-violet-50 px-4 py-3 text-sm font-black text-violet-800">Рассмотреть ставку против TAIS</button></div> '''
              s = s[:start] + replacement + s[mid:]

          # Action title no longer says queue.
          s = s.replace("{full && side === 'tais' ? 'Очередь на allocation' : 'Открыть позицию'}", "{full && side === 'tais' ? 'Event заполнен' : side === 'tais' ? 'Инвестировать в Event' : 'Ставка против TAIS'}")

          # Remove release button from an already committed position and label funds as locked.
          s = re.sub(r'<div className="flex items-center gap-2"><b className="text-sm text-emerald-950">\{formatCurrency\(myAllocation\)\}</b><button[^>]*onClick=\{release\}[\s\S]*?</button></div>', '<b className="text-sm text-emerald-950">{formatCurrency(myAllocation)}</b>', s, count=1)
          s = s.replace('</div>}{myContra > 0 && <div className="flex items-center justify-between rounded-xl border border-violet-100', '<p className="mt-1.5 text-[11px] text-emerald-700">Капитал зафиксирован до завершения Event</p></div>}{myContra > 0 && <div className="flex items-center justify-between rounded-xl border border-violet-100', 1)

          # Archive cards/details: remove all queue badges and execution rows.
          s = re.sub(r'<span className=\{`rounded-lg px-2\.5 py-1\.5 text-xs font-bold \$\{event\.queueUsed[\s\S]*?</span>', '<span className="rounded-lg bg-slate-100 px-2.5 py-1.5 text-xs font-bold text-slate-600">Длительность {event.activeDuration}</span>', s, count=1)
          s = re.sub(r'<div className="flex justify-between"><span>Очередь</span>[\s\S]*?\{event\.queueUsed && <div className="flex justify-between"><span>Пиковый спрос очереди</span><b>\{formatCurrency\(event\.queueCapital\)\}</b></div>\}', '', s, count=1)
          s = re.sub(r'^\s*const withQueue = .*\n', '', s, flags=re.M)
          s = s.replace('<Metric label="С очередью" value={`${withQueue}/${pastEvents.length}`} hint={`${profitable}/${pastEvents.length} прибыльных`} />', '<Metric label="Прибыльных Events" value={`${profitable}/${pastEvents.length}`} />')

          # Parent can no longer reduce committed capital.
          s = re.sub(r'^\s*const release = \(eventId: string, amount: number\) => .*\n', '', s, flags=re.M)
          s = re.sub(r' onRelease=\{\(amount\) => release\(selectedEvent\.id, amount\)\}', '', s)

          # Remove unused RefreshCcw import if it is no longer used.
          s = s.replace('  RefreshCcw,\n', '')

          forbidden = ['queueRequests', 'queueCapital', 'queueUsed', 'peakQueue', 'joinQueue', 'queuePosition', 'onRelease', 'onClick={release}', 'Очередь на allocation', 'Встать в очередь', 'Через очередь']
          leftovers = [token for token in forbidden if token in s]
          if leftovers:
              raise SystemExit('Remaining queue/release tokens: ' + ', '.join(leftovers))

          p.write_text(s)
          PY

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneshot-remove-event-queues.yml
          git add apps/cabinet/src/modules/events/pages/EventsPage.tsx
          git commit -m "Remove Event queues and lock committed capital"
          git push
