name: Validate onboarding flow

on:
  push:
    branches:
      - fix-individual-company-onboarding-flow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build --workspace=@trigonum/onboarding
      - run: npm run build --workspace=@trigonum/cabinet
